name: Build Fawad Karyana APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Capacitor init
        run: |
          if [ ! -f capacitor.config.json ]; then
            npx cap init "Hisab Kitab" com.yasirkhan.hisabkitab --web-dir=www/khata
          fi

      - name: Copy capacitor config
        run: |
          if [ -f khata.capacitor.config.json ]; then
            cp khata.capacitor.config.json capacitor.config.json
          fi

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fawad-karyana-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk